[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghosttrace-audit"
version = "0.2.0"
description = "Evidence-backed deletion audits with conservative abstention"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ghosttrace = "ghosttrace.__main__:main"

[tool.setuptools.packages.find]
include = ["ghosttrace*"]

[tool.setuptools.package-data]
ghosttrace = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]
